<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<body>
<main layout:fragment="main-content">
  <h1>Rechercher un article</h1>
  <form th:action="@{/recherche-reference}" th:object="${productLookupForm}" method="post">
    <label for="reference">Référence de l'article</label>
    <input type="text" th:field="*{reference}" placeholder="CAL-001"
           maxlength="30" aria-describedby="reference-error">
    <p id="reference-error" th:if="${#fields.hasErrors('reference')}"
       th:errors="*{reference}" role="alert"></p>
    <button type="submit">Rechercher</button>
  </form>
  <h2>Articles disponibles</h2>
  <ul>
    <li th:each="product : ${products}">
      <span th:text="${product.reference}">CAL-001</span> —
      <a th:href="@{/produits/{id}(id=${product.id})}"
         th:text="${product.name}">Calice impérial</a>
    </li>
  </ul>
</main>
</body>
</html>
